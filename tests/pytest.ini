# Pins pytest's rootdir to this tests/ directory.
#
# Why: custom_components/whirlpool/ is the HA integration package (it has an
# __init__.py and a select.py). If pytest's collection tree reaches it, pytest
# imports it as the top-level package ``whirlpool``, which collides with the
# real sixth-sense library package of the same name, and putting that
# directory on sys.path shadows the stdlib ``select`` module
# (asyncio -> selectors -> import select).
#
# With rootdir here, and no tests/__init__.py, pytest imports these test
# modules as plain top-level modules. It never imports custom_components/whirlpool,
# and conftest.py loads washer_staging.py under a test-only name.
[pytest]
addopts = -p no:cacheprovider
